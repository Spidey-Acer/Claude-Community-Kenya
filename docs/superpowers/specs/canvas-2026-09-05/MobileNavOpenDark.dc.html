<!doctype html>
<html>

<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #23201B; font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #F4EEE3; }
    a { color: #d2704a; text-decoration: none; } a:hover { color: #A84E2D; }
    .page { background: #1a1714; color: #F4EEE3; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 40px; }
    .serif { font-family: Newsreader, Georgia, "Times New Roman", serif; font-weight: 400; }
    .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #d2704a; }
    .h2 { font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.1; letter-spacing: -0.015em; color: #F4EEE3; margin: 0; }
    .h2 em { font-style: italic; color: #d2704a; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9999px; padding: 15px 26px; font-size: 15.5px; font-weight: 600; line-height: 1; white-space: nowrap; }
    .btn-clay { background: #d2704a; color: #221d17; } .btn-clay:hover { background: #A84E2D; color: #221d17; }
    .btn-outline { border: 1px solid #473d31; color: #F4EEE3; } .btn-outline:hover { border-color: #F4EEE3; color: #F4EEE3; }
    .card { background: #221d17; border: 1px solid #3a332a; border-radius: 16px; }
    .link { font-size: 15px; font-weight: 600; color: #d2704a; } .link:hover { color: #A84E2D; }
    .slot { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #8f8574; border: 1px dashed #473d31; border-radius: 999px; padding: 3px 8px; background: #221d17; }
    .muted { color: #9a9082; } .soft { color: #C7BEB0; }
    .cover { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
    .cover .motif { position: absolute; inset: 0; opacity: 0.16; }
    .cover .eyebrow { position: relative; font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #d2704a; }
    .cover .ct { position: relative; font-family: Newsreader, Georgia, serif; font-weight: 400; color: #F4EEE3; line-height: 1.12; letter-spacing: -0.01em; margin: 0; }
    .tone-a { background: linear-gradient(135deg, #2E231B, #2a231b); }
    .tone-b { background: linear-gradient(135deg, #3a332a, #3C3329); }
    .tone-c { background: linear-gradient(135deg, #422E22, #221d17); }
    .tone-d { background: linear-gradient(135deg, #2a231b, #342E25); }
    .m-meetup { background: repeating-radial-gradient(circle at 88% 120%, #d2704a 0 1px, transparent 1px 20px); }
    .m-workshop { background: repeating-linear-gradient(0deg, #d2704a 0 1px, transparent 1px 16px), repeating-linear-gradient(90deg, #d2704a 0 1px, transparent 1px 16px); }
    .m-talk { background: repeating-linear-gradient(0deg, #d2704a 0 1.5px, transparent 1.5px 13px); }
    .m-hack { background: repeating-linear-gradient(135deg, #d2704a 0 2px, transparent 2px 11px); }
    .m-conv { background: repeating-radial-gradient(circle at 12% -20%, #d2704a 0 1px, transparent 1px 18px); }
    .footer { background: #23201B; color: #E9E0D2; }
    .footer a { color: #C7BEB0; } .footer a:hover { color: #E6906F; }
    .footer .fh { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #8A7F6E; margin-bottom: 18px; }
    .ticker { background: #A84E2D; color: #FBF7F0; font-size: 12.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; overflow: hidden; white-space: nowrap; }
    .ticker span { display: inline-flex; align-items: center; gap: 22px; padding: 0 11px; }
    .cta-band { background: #A84E2D; color: #FBF7F0; border-radius: 24px; }
    .ticker .star { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #E6906F; }

    .btn { padding: 15px 22px; font-size: 15px; min-height: 48px; }
    .btn-full { width: 100%; box-sizing: border-box; }
    .ib { width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; }
    .top { font-family: Newsreader, Georgia, serif; font-size: 30px; line-height: 1.05; letter-spacing: -0.015em; color: #F4EEE3; display: flex; justify-content: space-between; align-items: baseline; }
    .top .cnt { font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #8f8574; text-transform: uppercase; }
    .sub { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; }
    .sub a { font-size: 14.5px; font-weight: 500; color: #C7BEB0; padding: 4px 0; min-height: 28px; display: inline-flex; align-items: center; }
    .sub a:hover { color: #d2704a; }
    .grp { padding: 14px 0; border-bottom: 1px solid #3a332a; }
    .city { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid #473d31; background: #221d17; padding: 9px 14px; font-size: 13.5px; font-weight: 600; color: #F4EEE3; min-height: 40px; box-sizing: border-box; }
    .city.on { background: #F4EEE3; color: #1a1714; border-color: #F4EEE3; }
  </style>
</helmet>
